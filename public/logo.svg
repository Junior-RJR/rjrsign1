<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="rjr-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0052FF" />
      <stop offset="100%" stop-color="#00C2FF" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <drop-shadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.15"/>
    </filter>
  </defs>
  <!-- Background Shield or Rounded Square -->
  <rect x="10" y="10" width="80" height="80" rx="22" fill="url(#rjr-grad)" filter="url(#shadow)" />
  
  <!-- Stylized Elegant Pen & R combined shape -->
  <path d="M35 30 H55 C65 30 65 42 55 42 H35" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M35 30 V70" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M45 42 L62 70" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Signature stroke flowing through -->
  <path d="M25 72 C40 65 60 78 78 68" stroke="#00F0FF" stroke-width="5" stroke-linecap="round" />
</svg>
